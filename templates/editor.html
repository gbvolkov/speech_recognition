<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transcript Editor</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- Include Quill CSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
  <h1>Transcript Editor</h1>
  <form id="editorForm" method="post" action="/download">
    <!-- Container for the Quill editor -->
    <div id="editor-container" style="height: 300px;">
    </div>
    <!-- Hidden input to hold HTML content before submission -->
    <input type="hidden" name="html_content" id="html_content">
    <h3>Rename Speakers</h3>
    {% for speaker in speakers %}
      <label>{{ speaker }}: <input type="text" name="{{ speaker }}" placeholder="Enter real name"></label><br>
    {% endfor %}
    <button type="button" onclick="applyRename()">Apply Renaming</button>
    <br><br>
    <input type="hidden" name="format" id="format" value="markup">
    <button type="submit" onclick="document.getElementById('format').value='markup'; updateEditorContent();">Download as Markup</button>
    <button type="submit" onclick="document.getElementById('format').value='word'; updateEditorContent();">Download as Word Doc</button>
  </form>

  <!-- Include Quill JS -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script>
    // Initialize Quill editor with the transcript HTML content pre-loaded.
    var quill = new Quill('#editor-container', {
      theme: 'snow'
    });
    // Set initial content (the transcript HTML) from the server.
    quill.root.innerHTML = `{{ transcript|safe }}`;

    // Before form submission, update the hidden field with the current HTML content.
    function updateEditorContent() {
      document.getElementById("html_content").value = quill.root.innerHTML;
    }
  </script>
  <script src="{{ url_for('static', filename='js/rename.js') }}"></script>
</body>
</html>
