<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transcription in Progress</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Simple spinner CSS */
    .spinner {
      border: 16px solid #f3f3f3;
      border-top: 16px solid #3498db;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      animation: spin 2s linear infinite;
      margin: 50px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #timer, #queueStatus {
      text-align: center;
      font-size: 1.2em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Transcription in Progress</h1>
  <div class="spinner"></div>
  <div id="queueStatus">Checking queue status...</div>
  <div id="timer">Time elapsed: 0 seconds</div>
  
  <!-- Define the global JOB_ID variable -->
  <script>
    var JOB_ID = "{{ job_id }}";
  </script>
  <!-- Include the external JavaScript file -->
  <script src="{{ url_for('static', filename='js/waiting.js') }}"></script>
</body>
</html>
